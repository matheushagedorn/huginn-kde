# wallust v3 config
backend = "fastresize"
color_space = "salience"
palette = "saliencedark"
skip_sequences = true

[templates]
discord       = { template = 'discord.css', target = '~/.config/equibop/themes/wallust.css' }
discord_quick = { template = 'discord.css', target = '~/.config/equibop/settings/quickCss.css' }
gtk3          = { template = 'gtk.css', target = '~/.config/gtk-3.0/gtk.css' }
gtk4          = { template = 'gtk.css', target = '~/.config/gtk-4.0/gtk.css' }
vscode        = { template = 'vscode.json', target = '~/.config/Code/User/settings.json' }
vscode_oss    = { template = 'vscode.json', target = '~/.config/Code - OSS/User/settings.json' }
zen           = { template = 'zen.css', target = '~/.config/zen/wwv0mqrf.Default (release)/chrome/userChrome.css' }
